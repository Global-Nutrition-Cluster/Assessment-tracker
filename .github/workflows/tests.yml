name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ["scripts/**", "assets/js/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests (normalisation rules)
        run: python -m unittest discover -s scripts/tests -v
      - name: JavaScript checks (imports point to existing files, every module parses)
        run: python scripts/check_js.py
